<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rudra Computers</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
            <img src="{{ url_for('static', filename='logo.svg') }}" alt="Rudra" height="40">
            <span>Rudra Computers</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/"><span class="bi bi-grid-1x2-fill me-1"></span>Home</a>
                <a class="nav-link" href="/billing"><span class="bi bi-receipt-cutoff me-1"></span>Billing</a>
                <a class="nav-link" href="/reports"><span class="bi bi-graph-up-arrow me-1"></span>Reports</a>
                <a class="nav-link" href="/stock"><span class="bi bi-box-seam-fill me-1"></span>Stock</a>
                <a class="nav-link position-relative" href="{{ url_for('view_cart') }}">
                    <span class="bi bi-cart3 me-1"></span>Cart
                    {% if cart_count %}
                    <span class="badge bg-danger rounded-pill ms-1">{{ cart_count }}</span>
                    {% endif %}
                </a>
            </div>
        </div>
    </div>
</nav>

<div class="container app-shell">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
