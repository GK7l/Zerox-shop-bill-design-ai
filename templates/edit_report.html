{% extends 'base.html' %}

{% block content %}
<div class="page-heading d-flex flex-column flex-md-row justify-content-between align-items-start gap-3 mb-4">
    <div>
        <h3 class="mb-1">Edit Report #{{ bill.id }}</h3>
        <p class="text-muted">Update invoice items. The report total is recalculated when saved.</p>
    </div>
    <a href="{{ url_for('reports') }}" class="btn btn-outline-secondary"><span class="bi bi-arrow-left"></span>Back to Reports</a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form action="{{ url_for('edit_report', bill_id=bill.id) }}" method="post">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Service</th>
                            <th class="text-center">Quantity</th>
                            <th class="text-end">Unit Price</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for item in items %}
                        <tr>
                            <td>
                                <input name="name_{{ item.id }}" type="text" value="{{ item.service_name }}" class="form-control" required>
                            </td>
                            <td class="text-center" style="width: 140px;">
                                <input name="quantity_{{ item.id }}" type="number" min="1" value="{{ item.quantity }}" class="form-control text-center" required>
                            </td>
                            <td class="text-end" style="width: 180px;">
                                <input name="price_{{ item.id }}" type="number" min="0" step="0.01" value="{{ item.price }}" class="form-control text-end" required>
                            </td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="3" class="text-center text-muted py-4">No items found for this report.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="{{ url_for('reports') }}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary"><span class="bi bi-check2"></span>Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
