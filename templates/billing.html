{% extends 'base.html' %}

{% block content %}
<div class="page-heading d-flex flex-column flex-md-row justify-content-between align-items-start gap-3 mb-4">
    <div>
        <h3 class="mb-1">Billing</h3>
        <p class="text-muted">Enter quantities for the services you want to add to the invoice.</p>
    </div>
    <a href="/" class="btn btn-outline-secondary"><span class="bi bi-grid-1x2-fill"></span>View Services</a>
</div>

<form method="POST">
    <div class="table-responsive rounded shadow-sm bg-white">
        <table class="table table-bordered mb-0 align-middle">
            <thead class="table-light">
                <tr>
                    <th>Service</th>
                    <th>Price</th>
                    <th class="text-center">Quantity</th>
                </tr>
            </thead>
            <tbody>
                {% for s in services %}
                <tr>
                    <td>{{ s.name }}</td>
                    <td>₹{{ s.price }}</td>
                    <td>
                        <input type="hidden" name="name" value="{{ s.name }}">
                        <input type="number" name="qty" min="0" value="0" class="form-control" placeholder="0">
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <div class="mt-4 text-end">
        <button type="submit" class="btn btn-success btn-lg"><span class="bi bi-receipt"></span>Generate Bill</button>
    </div>
</form>
{% endblock %}
