{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center login-wrap">
    <div class="col-md-5 col-lg-4">
        <div class="text-center mb-5">
            <img src="{{ url_for('static', filename='logo.svg') }}" alt="Rudra Computers" height="120" class="mb-3 login-logo">
        </div>
        <div class="card">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-3">Login</h3>
                <p class="text-muted text-center mb-4">Use <strong>admin/admin</strong> or <strong>ganesh/IT</strong>.</p>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label" for="username">Username</label>
                        <input id="username" name="username" type="text" class="form-control" placeholder="Enter your username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <input id="password" name="password" type="password" class="form-control" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100"><span class="bi bi-box-arrow-in-right"></span>Sign In</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
